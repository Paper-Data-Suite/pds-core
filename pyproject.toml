[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pds-core"
version = "0.6.3"
description = "Shared contracts and infrastructure for Paper Data Suite modules."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Stephen Severino" }
]
dependencies = []

[project.scripts]
pds-core = "pds_core.cli:main"
core = "pds_core.core_menu:main"

[project.optional-dependencies]
dev = [
    "build",
    "pytest",
    "ruff",
    "mypy",
    "packaging>=24",
    "twine",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.11"
strict = true
explicit_package_bases = true

[tool.setuptools.package-data]
pds_core = ["starter_data/standards/*.json"]
